name: Validate application
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'self-hosted' }}
    steps:
      - uses: actions/checkout@v4
      - name: Provision Node on GitHub.com
        if: github.server_url == 'https://github.com'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install from approved configured npm registry
        run: npm ci
      - name: Unit and component tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Provision browser on GitHub.com
        if: github.server_url == 'https://github.com'
        run: npx playwright install --with-deps chromium
      - name: Browser operational tests
        run: npm run test:e2e
      - name: Upload validation evidence on GitHub.com
        if: always() && github.server_url == 'https://github.com'
        uses: actions/upload-artifact@v4
        with:
          name: validation-evidence
          path: artifacts/
